# test-tools-schema.yaml
# .opal/test-tools.yaml 스키마 레퍼런스
#
# 이 파일은 test-tools.yaml의 모든 필드를 설명하는 레퍼런스다.
# 실제 프로젝트 파일은 opal/templates/test-tools.yaml 을 복사하여 사용한다.

# ─── 최상위 필드 ──────────────────────────────────────────────────────────────

version:
  type: string
  required: true
  description: 스키마 버전. 현재 "1.0"
  example: "1.0"

# ─── stack 섹션 ───────────────────────────────────────────────────────────────

stack:
  description: |
    프로젝트 스택 선언. dtp-agent의 Step 1-b 도구 추론과
    dtp-test의 Step 1-a fallback 추론에 사용된다.
  required: false
  fields:
    language:
      type: string
      required: true
      description: 주 언어
      valid_values: [typescript, python, go, java, rust, ruby, php, csharp, swift]
    framework:
      type: string
      required: false
      description: 프레임워크 (선택)
      examples: [nextjs, express, fastapi, gin, rails, django, laravel]
    runtime:
      type: string
      required: false
      description: 런타임 (선택)
      examples: [node, bun, deno, python, go, jvm]

# ─── global 섹션 ──────────────────────────────────────────────────────────────

global:
  description: |
    스택에 무관하게 모든 프로젝트에 적용되는 도구 목록.
    dtp-test가 항상 실행한다 (required: true 기본값).
  required: false
  type: list
  item_fields:
    name:
      type: string
      required: true
      description: 도구 이름 (고유 식별자)
    purpose:
      type: string
      required: true
      description: 도구의 역할 설명
    category:
      type: string
      required: true
      description: 도구 카테고리
      valid_values: [unit, e2e, lint, typecheck, format, security]
    check:
      type: string
      required: true
      description: 설치 여부를 확인하는 명령어. 종료 코드 0이면 설치됨으로 판단.
      example: "gitleaks version"
    install:
      type: string | object
      required: true
      description: |
        설치 명령. 두 가지 형식을 지원한다:
        - 단일 문자열: 크로스플랫폼 도구 (npm, pip 등)
        - 플랫폼 맵: OS별 명령이 다른 도구 (mac/windows/linux 키)
      examples:
        cross_platform: "npm install -D vitest"
        platform_map:
          mac: "brew install gitleaks"
          windows: "choco install gitleaks"
          linux: "curl -sSfL https://... | tar -xz"
    install_fallback:
      type: string
      required: false
      description: 플랫폼 키 미존재 시 제시하는 URL (공식 릴리스 페이지 등)
      example: "https://github.com/gitleaks/gitleaks/releases"
    required:
      type: boolean
      required: true
      description: |
        true: 미설치 시 사용자에게 설치 제안 후 승인 대기.
              미승인 시 해당 시나리오 "환경 미준비 — Skip" 처리.
        false: 미설치 시 해당 시나리오 자동 Skip (사용자 승인 불필요).

# ─── tools 섹션 ───────────────────────────────────────────────────────────────

tools:
  description: |
    카테고리별 테스트 도구 목록. stack 선언에 따라 활성화된다.
    각 카테고리에 여러 도구가 있을 경우 첫 번째 항목이 기본값으로 사용된다.
  required: false
  categories:
    unit:
      description: 단위 테스트 도구
    e2e:
      description: E2E / 통합 테스트 도구
    lint:
      description: 정적 분석 / 린터
    typecheck:
      description: 타입 체크 도구
    format:
      description: 코드 포맷터
  item_fields:
    name:
      type: string
      required: true
      description: 도구 이름
    purpose:
      type: string
      required: true
      description: 도구 역할 설명
    check:
      type: string
      required: true
      description: 설치 여부 확인 명령 (global.item_fields.check 동일)
    install:
      type: string | object
      required: true
      description: 설치 명령 (global.item_fields.install 동일)
    install_fallback:
      type: string
      required: false
      description: 플랫폼 미지원 시 fallback URL
    required:
      type: boolean
      required: true
      description: 필수 여부 (global.item_fields.required 동일)

# ─── 우선순위 및 Fallback 규칙 ────────────────────────────────────────────────

resolution_order:
  description: dtp-test의 레지스트리 탐색 순서
  steps:
    1: "{project}/.opal/test-tools.yaml — 프로젝트별 오버라이드 (최우선)"
    2: "~/.opal/templates/test-tools.yaml — 글로벌 기본값"
    3: "package.json / pyproject.toml 추론 — 둘 다 없을 때 fallback"

# ─── 시나리오 유형 → 카테고리 매핑 ────────────────────────────────────────────

scenario_type_mapping:
  description: |
    시나리오 유형에 따라 어떤 카테고리의 도구를 사용할지 정의.
    dtp-agent의 Step 1-b와 test-scenario-guide.md의 매핑 테이블에 사용된다.
  mappings:
    - scenario_type: 함수/클래스 단위 검증
      category: unit
    - scenario_type: API 엔드포인트 검증
      category: [e2e, unit]
      note: E2E(playwright) 또는 단위(supertest) 중 선택
    - scenario_type: 브라우저 UI 검증
      category: e2e
    - scenario_type: 린트/포맷
      category: [lint, format]
    - scenario_type: 타입 안전성
      category: typecheck
    - scenario_type: 시크릿/보안
      category: security
      note: global.gitleaks 사용 (stack 무관)
